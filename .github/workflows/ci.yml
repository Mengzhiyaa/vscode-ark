name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPERVISOR_CHECKOUT_PATH: .deps/vscode-supervisor
      SUPERVISOR_REPOSITORY: Mengzhiyaa/vscode-supervisor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout supervisor API source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUPERVISOR_REPOSITORY }}
          path: ${{ env.SUPERVISOR_CHECKOUT_PATH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .deps/vscode-supervisor/package-lock.json

      - name: Install ark dependencies
        run: npm ci

      - name: Install supervisor dependencies
        run: npm ci
        working-directory: ${{ env.SUPERVISOR_CHECKOUT_PATH }}

      - name: Build supervisor development dependency
        run: npm run build
        working-directory: ${{ env.SUPERVISOR_CHECKOUT_PATH }}

      - name: Verify public API sync
        run: npm run verify:supervisor-api -- $SUPERVISOR_CHECKOUT_PATH

      - name: Run tests
        env:
          SUPERVISOR_DEV_EXTENSION_PATH: ${{ env.SUPERVISOR_CHECKOUT_PATH }}
        run: npm run test:unit:ext

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            target_os: linux
            target_arch: x64
          - runner: ubuntu-latest
            target: linux-arm64
            target_os: linux
            target_arch: arm64
          - runner: macos-15
            target: darwin-x64
            target_os: darwin
            target_arch: x64
          - runner: macos-latest
            target: darwin-arm64
            target_os: darwin
            target_arch: arm64
          - runner: windows-latest
            target: win32-x64
            target_os: windows
            target_arch: x64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install target binaries
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: npm run install:binaries -- --retry 3

      - name: Package target VSIX
        shell: bash
        run: |
          mkdir -p artifacts
          npx vsce package --no-dependencies --target "${{ matrix.target }}" --out "artifacts/vscode-ark-${{ matrix.target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-ark-${{ matrix.target }}
          path: artifacts/*.vsix
          retention-days: 1

  publish-ci-prerelease:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vscode-ark-ci-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: CI Pre-release
      RELEASE_TAG: ci-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Refresh CI pre-release
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.vsix)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No VSIX artifacts found"
            exit 1
          fi

          branch_ref="${GITHUB_REF_NAME//\//%2F}"
          branch_head="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_ref}" --jq '.object.sha')"
          if [ "${branch_head}" != "${GITHUB_SHA}" ]; then
            echo "Skip prerelease publish because ${GITHUB_REF_NAME} advanced to ${branch_head}"
            exit 0
          fi

          cat > prerelease-notes.md <<EOF
          Automated CI pre-release for \`${GITHUB_REF_NAME}\`.

          Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          EOF

          gh release delete "${RELEASE_TAG}" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh api \
            --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            >/dev/null 2>&1 || true

          gh release create "${RELEASE_TAG}" "${files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file prerelease-notes.md \
            --prerelease
